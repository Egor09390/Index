name: Build Termux COPY + FULL ARM64 APK
on:
  push:
    branches: [termux-copy-buttons]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch
        uses: actions/checkout@v4
      - name: Clone official Termux
        run: |
          git clone https://github.com/termux/termux-app.git termux-src
          git -C termux-src checkout 8629e632fcb95da272221be327db653fb24befe9
      - name: Apply COPY patch
        run: |
          git -C termux-src apply --check ../termux-copy-buttons.patch
          git -C termux-src apply ../termux-copy-buttons.patch
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android 7+ APK
        working-directory: termux-src
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
          TERMUX_APK_VERSION_TAG: copy-keys-${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew :terminal-emulator:testDebugUnitTest --tests com.termux.terminal.HistoryTest assembleDebug --no-daemon
          set -euo pipefail
          ls -lh app/build/outputs/apk/debug/*.apk
          test "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*_arm64-v8a.apk' | wc -l)" -eq 1
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-copy-full-arm64-v8a
          path: termux-src/app/build/outputs/apk/debug/*_arm64-v8a.apk
          if-no-files-found: error
      - name: Publish prerelease with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="termux-copy-buttons-${{ github.run_number }}"
          gh release create "$tag" termux-src/app/build/outputs/apk/debug/*_arm64-v8a.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Termux COPY/FULL ARM64-v8a build ${{ github.run_number }}" \
            --notes "Unofficial Android 7+ arm64-v8a debug APK. FULL copies the retained scrollback with the same line wrapping as manual selection. For long transcripts, use Paste from the destination text field or swipe up on FULL to share a .txt file. COPY filters output from the most recent pasted commands and uses the same clipboard path as FULL. The round ivory arrow opens the sessions menu, where holding a session shows Delete. Different APK signatures may prevent installing over an existing Termux." \
            --prerelease
