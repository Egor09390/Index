name: Build Termux COPY + COPY1 APK
on:
  push:
    branches: [termux-copy-buttons]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch
        uses: actions/checkout@v4
      - name: Clone official Termux
        run: |
          git clone https://github.com/termux/termux-app.git termux-src
          git -C termux-src checkout 8629e632fcb95da272221be327db653fb24befe9
      - name: Apply COPY patch
        run: |
          git -C termux-src apply --check ../termux-copy-buttons.patch
          git -C termux-src apply ../termux-copy-buttons.patch
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android 7+ APK
        working-directory: termux-src
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '0'
          TERMUX_APK_VERSION_TAG: copy-keys-${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/*.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-copy-buttons-apk
          path: termux-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish prerelease with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="termux-copy-buttons-${{ github.run_number }}"
          gh release create "$tag" termux-src/app/build/outputs/apk/debug/*.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Termux COPY/COPY1 build ${{ github.run_number }}" \
            --notes "Unofficial Android 7+ debug APK. Official Termux source commit: 8629e632fcb95da272221be327db653fb24befe9. Custom patch: termux-copy-buttons.patch. COPY is a best-effort output filter, COPY1 includes the retained scrollback. Different APK signatures may prevent installing over an existing Termux." \
            --prerelease
