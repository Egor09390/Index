name: Build Termux COPY + FULL ARM64 APK
on:
  push:
    branches: [termux-copy-buttons]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch
        uses: actions/checkout@v4
      - name: Clone official Termux
        run: |
          git clone https://github.com/termux/termux-app.git termux-src
          git -C termux-src checkout 8629e632fcb95da272221be327db653fb24befe9
      - name: Apply COPY patch
        run: |
          git -C termux-src apply --check ../termux-copy-buttons.patch
          git -C termux-src apply ../termux-copy-buttons.patch
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android 7+ APK
        working-directory: termux-src
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
          TERMUX_APK_VERSION_TAG: copy-keys-${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew :terminal-emulator:testDebugUnitTest --tests com.termux.terminal.HistoryTest :app:testDebugUnitTest --tests com.termux.app.terminal.io.FullTranscriptCopyQueueTest assembleDebug --no-daemon
          set -euo pipefail
          ls -lh app/build/outputs/apk/debug/*.apk
          test "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*_arm64-v8a.apk' | wc -l)" -eq 1
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-copy-full-arm64-v8a
          path: termux-src/app/build/outputs/apk/debug/*_arm64-v8a.apk
          if-no-files-found: error
      - name: Publish prerelease with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="termux-copy-buttons-${{ github.run_number }}"
          gh release create "$tag" termux-src/app/build/outputs/apk/debug/*_arm64-v8a.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Termux COPY/FULL ARM64-v8a build ${{ github.run_number }}" \
            --notes "Unofficial Android 7+ arm64-v8a debug APK. FULL saves long transcripts in Downloads as a complete .txt file and copies them in parts. COPY leaves the clipboard alone after empty output. Feedback appears in the Termux header. The toolbar uses three evenly spaced monospace keys. The white arrow opens a numbered sessions list with a bin on every row. Different APK signatures may prevent installing over an existing Termux." \
            --prerelease
